<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Webrivo | Top Web Design & Digital Transformation Agency</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="description"
    content="Webrivo is a premier digital transformation agency specializing in custom web development, Google Maps SEO, and branding for local businesses. We turn local vendors into global brands." />
  <meta name="keywords"
    content="Web Design Agency, Digital Transformation, Local SEO, Google Maps SEO, Custom Web Development, Branding, Small Business Website, Webrivo" />
  <meta name="author" content="Webrivo" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://webrivo.vercel.app/" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://webrivo.vercel.app/" />
  <meta property="og:title" content="Webrivo | Top Web Design & Digital Transformation Agency" />
  <meta property="og:description"
    content="Transform your local business with Webrivo. We offer award-winning web design, SEO, and digital branding services tailored for results." />
  <meta property="og:image" content="https://webrivo.vercel.app/og-image.jpg" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://webrivo.vercel.app/" />
  <meta property="twitter:title" content="Webrivo | Top Web Design & Digital Transformation Agency" />
  <meta property="twitter:description"
    content="Transform your local business with Webrivo. We offer award-winning web design, SEO, and digital branding services tailored for results." />
  <meta property="twitter:image" content="https://webrivo.vercel.app/og-image.jpg" />

  <!-- Structured Data -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "name": "Webrivo",
          "url": "https://webrivo.vercel.app/",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://webrivo.vercel.app/search?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "ProfessionalService",
          "name": "Webrivo",
          "url": "https://webrivo.vercel.app/",
          "sameAs": [
            "https://www.facebook.com/webrivo",
            "https://www.twitter.com/webrivo",
            "https://www.linkedin.com/company/webrivo",
            "https://www.instagram.com/webrivo"
          ],
          "address": {
            "@type": "PostalAddress",
            "addressCountry": "US"
          },
          "description": "Webrivo is a premier digital transformation agency specializing in custom web development, Google Maps SEO, and branding for local businesses.",
          "priceRange": "$$"
        }
      ]
    }
    </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#fafafa',
              100: '#f5f5f5',
              500: '#10b981', // Emerald
              600: '#059669',
              900: '#171717',
              950: '#0a0a0a', // Neutral 950 base
            },
            accent: {
              primary: '#10b981', // Emerald
              secondary: '#2dd4bf', // Teal
              tertiary: '#0ea5e9', // Sky
            }
          },
          animation: {
            'float': 'float 6s ease-in-out infinite',
            'float-delayed': 'float 6s ease-in-out 3s infinite',
            'marquee': 'marquee 25s linear infinite',
            'pulse-glow': 'pulse-glow 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'spin-slow': 'spin 12s linear infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-20px)' },
            },
            marquee: {
              '0%': { transform: 'translateX(0%)' },
              '100%': { transform: 'translateX(-100%)' },
            },
            'pulse-glow': {
              '0%, 100%': { opacity: 0.5, transform: 'scale(1)' },
              '50%': { opacity: 0.8, transform: 'scale(1.1)' },
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0a0a0a;
      /* Neutral 950 */
      color: #f5f5f5;
      overflow-x: hidden;
    }

    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;
      /* IE and Edge */
      scrollbar-width: none;
      /* Firefox */
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/main.jsx"></script>
</body>

</html>
