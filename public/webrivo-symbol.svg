<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="title">
  <title id="title">WebRivo symbol</title>
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#18352B" flood-opacity=".18"/>
    </filter>
  </defs>
  <g filter="url(#sh)">
    <!-- 14-petal flower edge built from rotated ellipses -->
    <g fill="#F4F5EF" stroke="#DDE3D5" stroke-width="1.6" stroke-linejoin="round">
      <ellipse cx="60" cy="25" rx="17" ry="25"/>
      <ellipse cx="60" cy="25" rx="17" ry="25" transform="rotate(25.714 60 60)"/>
      <ellipse cx="60" cy="25" rx="17" ry="25" transform="rotate(51.428 60 60)"/>
      <ellipse cx="60" cy="25" rx="17" ry="25" transform="rotate(77.142 60 60)"/>
      <ellipse cx="60" cy="25" rx="17" ry="25" transform="rotate(102.856 60 60)"/>
      <ellipse cx="60" cy="25" rx="17" ry="25" transform="rotate(128.57 60 60)"/>
      <ellipse cx="60" cy="25" rx="17" ry="25" transform="rotate(154.284 60 60)"/>
      <ellipse cx="60" cy="25" rx="17" ry="25" transform="rotate(180 60 60)"/>
      <ellipse cx="60" cy="25" rx="17" ry="25" transform="rotate(205.714 60 60)"/>
      <ellipse cx="60" cy="25" rx="17" ry="25" transform="rotate(231.428 60 60)"/>
      <ellipse cx="60" cy="25" rx="17" ry="25" transform="rotate(257.142 60 60)"/>
      <ellipse cx="60" cy="25" rx="17" ry="25" transform="rotate(282.856 60 60)"/>
      <ellipse cx="60" cy="25" rx="17" ry="25" transform="rotate(308.57 60 60)"/>
      <ellipse cx="60" cy="25" rx="17" ry="25" transform="rotate(334.284 60 60)"/>
    </g>
    <!-- forest core -->
    <circle cx="60" cy="60" r="44" fill="#18352B"/>
    <!-- orbit ring -->
    <circle cx="60" cy="60" r="37" fill="none" stroke="#DDE3D5" stroke-width="1.7" stroke-dasharray="2.5 4"/>
    <!-- W mark -->
    <path fill="#F4F5EF" d="M28 46 42.5 81 60 48 77.5 81 92 46 80.5 40 72.5 61 60 36 47.5 61 39.5 40Z"/>
    <!-- upward chevron arrow, no backline -->
    <path d="M48 39 60 27 72 39" fill="none" stroke="#DDE3D5" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
